<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas ESG · Escolha o seu mercado</title>
<style>
:root{--ink:#16332f;--teal:#3d8880;--teal-d:#2c6e67;--bg:#f1f8f8;--line:#d3e3e1;--gray:#566d6a;--card:#fff}
@media (prefers-color-scheme:dark){:root{--ink:#e6f2f0;--bg:#0f1e1c;--line:#27403c;--gray:#9db5b1;--card:#16332f}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{width:100%;max-width:560px;text-align:center}h1{font-size:28px;margin:0 0 8px}p{color:var(--gray);margin:0 0 28px}
.g{display:grid;gap:14px;grid-template-columns:1fr 1fr}@media (max-width:480px){.g{grid-template-columns:1fr}}
a{display:block;padding:22px 16px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font-weight:600}
a small{display:block;margin-top:6px;font-weight:400;color:var(--gray)}a:hover,a:focus-visible{border-color:var(--teal);outline:2px solid var(--teal);outline-offset:2px}
</style></head><body><main>
<h1>Atlas ESG</h1><p>Escolha o seu mercado para ver idioma e preços corretos.</p>
<div class="g"><a href="/br/">Brasil<small>Preços em R$</small></a><a href="/eu/">Europa<small>Preços em €</small></a></div>
</main></body></html>
